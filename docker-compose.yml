services:
  # ─── Local PostgreSQL (development only) ───────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dofus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dofus}
      POSTGRES_DB: ${POSTGRES_DB:-dofus_wanted}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dofus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Development server (hot-reload) ───────────────────────────────────────
  dev:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy

  # ─── Production server ──────────────────────────────────────────────────────
  prod:
    build:
      context: .
      target: production
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - prod

volumes:
  postgres_data:
